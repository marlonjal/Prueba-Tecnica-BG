services:
  tests:
    build: .
    init: true
    shm_size: "1gb"
    environment:
      PARABANK_BASE_URL: ${PARABANK_BASE_URL:-https://parabank.parasoft.com/parabank}
      PARABANK_API_URL: ${PARABANK_API_URL:-https://parabank.parasoft.com/parabankv2/services/bank}
      PARABANK_USERNAME: ${PARABANK_USERNAME:-john}
      PARABANK_PASSWORD: ${PARABANK_PASSWORD:-demo}
      BROWSER: ${BROWSER:-chromium}
      HEADLESS: ${HEADLESS:-true}
      SLOW_MO: ${SLOW_MO:-0}
      DEFAULT_TIMEOUT: ${DEFAULT_TIMEOUT:-15000}
      NAVIGATION_TIMEOUT: ${NAVIGATION_TIMEOUT:-30000}
      EVIDENCE_EACH_STEP: ${EVIDENCE_EACH_STEP:-false}
      CLEAN_RESULTS: ${CLEAN_RESULTS:-false}
    volumes:
      - ./results:/app/results

[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --import-mode=importlib
    --html=results/reports/report.html
    --self-contained-html
    --cucumberjson=results/reports/cucumber-report.json
markers =
    smoke: critical-path validation
    regression: complete functional regression suite
    positive: valid business behavior
    negative: validation or error behavior
    ui: web user-interface automation
    api: REST API automation
    destructive: modifies persistent data or account balances
